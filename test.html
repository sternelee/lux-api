<!DOCTYPE html>
<html>
<head>
    <title>Lux API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #007cba; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #005a8b; }
        .response { margin-top: 20px; padding: 15px; background-color: #f5f5f5; border-radius: 4px; white-space: pre-wrap; }
        .error { background-color: #ffebee; color: #c62828; }
        .success { background-color: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lux API Test</h1>
        
        <div class="form-group">
            <label for="url">Video URL:</label>
            <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." />
        </div>
        
        <div class="form-group">
            <label for="format">Format (optional):</label>
            <input type="text" id="format" placeholder="hd, sd, etc." />
        </div>
        
        <div class="form-group">
            <label for="quality">Quality (optional):</label>
            <input type="text" id="quality" placeholder="high, medium, low" />
        </div>
        
        <button onclick="testGet()">Test GET Request</button>
        <button onclick="testPost()">Test POST Request</button>
        <button onclick="testHealth()">Test Health Check</button>
        
        <div id="response" class="response" style="display: none;"></div>
    </div>

    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("worker.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });

        function showResponse(data, isError = false) {
            const responseDiv = document.getElementById('response');
            responseDiv.style.display = 'block';
            responseDiv.className = 'response ' + (isError ? 'error' : 'success');
            responseDiv.textContent = JSON.stringify(JSON.parse(data), null, 2);
        }

        function testGet() {
            const url = document.getElementById('url').value;
            const format = document.getElementById('format').value;
            const quality = document.getElementById('quality').value;
            
            if (!url) {
                alert('Please enter a URL');
                return;
            }

            const queryString = new URLSearchParams({ url, format, quality }).toString();
            const mockRequest = {
                method: 'GET',
                url: `http://localhost/api/extract?${queryString}`,
                headers: {},
                body: ''
            };

            try {
                const result = handleRequest(mockRequest);
                showResponse(result);
            } catch (error) {
                showResponse(JSON.stringify({ error: error.message }), true);
            }
        }

        function testPost() {
            const url = document.getElementById('url').value;
            const format = document.getElementById('format').value;
            const quality = document.getElementById('quality').value;
            
            if (!url) {
                alert('Please enter a URL');
                return;
            }

            const mockRequest = {
                method: 'POST',
                url: 'http://localhost/api/extract',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, format, quality })
            };

            try {
                const result = handleRequest(mockRequest);
                showResponse(result);
            } catch (error) {
                showResponse(JSON.stringify({ error: error.message }), true);
            }
        }

        function testHealth() {
            const mockRequest = {
                method: 'GET',
                url: 'http://localhost/api/health',
                headers: {},
                body: ''
            };

            try {
                const result = handleRequest(mockRequest);
                showResponse(result);
            } catch (error) {
                showResponse(JSON.stringify({ error: error.message }), true);
            }
        }
    </script>
</body>
</html>
