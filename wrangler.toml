name = "lux-api"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "./build-wasm.sh"

# Specify WASM modules (new format)
wasm_modules = ["worker.wasm"]

# Environment variables
[vars]
SERVICE_NAME = "lux-api"
VERSION = "1.0.0"

# Development settings
[env.development]
name = "lux-api-dev"

# Production settings  
[env.production]
name = "lux-api"

# Routes (optional, configure your custom domain here)
# [[routes]]
# pattern = "lux-api.example.com/*"
# zone_name = "example.com"

# KV namespaces (if needed for caching)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Durable Objects (if needed)
# [[durable_objects.bindings]]
# name = "COUNTER"
# class_name = "Counter"